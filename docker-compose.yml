services:
  conductor:
    build: .
    ports:
      - "5402:3000"
    env_file:
      - .env
    environment:
      # Talks to the shared `postgres` container on the external postgres_default network.
      # That container holds Conductor's real data (created/owned by user `conductor`).
      DATABASE_URL: postgresql://conductor:localdev@postgres:5432/conductor
      NODE_ENV: production
      UPLOAD_DIR: /opt/conductor/uploads
      # Change this if deploying to a real domain or different port
      NEXTAUTH_URL: http://localhost:5402
      # Conductor's dedicated MLX server on the macOS host (com.conductor.mlx, port 11436).
      # Port 11435 is the kosmos PRODUCTION server — never point Conductor back at it
      # without reading docs/RUNBOOK_LOCAL_AI.md.
      LOCAL_AI_BASE_URL: ${LOCAL_AI_BASE_URL:-http://host.docker.internal:11436/v1}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-mlx-community/Qwen3-30B-A3B-Instruct-2507-4bit}
    volumes:
      - uploads:/opt/conductor/uploads
    networks:
      - default
      - shared-postgres
    restart: unless-stopped

  conductor-cron:
    image: alpine:3.19
    command: >
      sh -c "
        apk add --no-cache curl > /dev/null 2>&1 &&
        mkdir -p /scripts &&
        cp /cron-src/sync.sh /scripts/sync.sh &&
        chmod +x /scripts/sync.sh &&
        crontab /cron-src/sync-crontab &&
        touch /var/log/cron.log &&
        echo 'Cron started — syncs run hourly' &&
        crond -f -l 2
      "
    environment:
      CONDUCTOR_URL: http://conductor:3000
      LINEAR_SYNC_SECRET: ${LINEAR_SYNC_SECRET:-conductor-linear-sync}
    volumes:
      - ./cron:/cron-src:ro
    depends_on:
      - conductor
    restart: unless-stopped

volumes:
  uploads:

networks:
  shared-postgres:
    external: true
    name: postgres_default
